<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プライバシー — グンギ</title>
    <style>
      body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>プライバシー</h1>
    <p>グンギは非公式のファン再構成アプリです。アカウント登録はありません。</p>
    <ul>
      <li>称号・カード進捗は、この端末の localStorage だけに残します。</li>
      <li>オンライン対局は PeerJS で端末同士がつながります。部屋コード以外の個人情報は送りません。</li>
      <li>対局の操作ログをホスティングの実行ログへ送ることがあります（名前・メールは含みません）。解析画面はありません。</li>
      <li>広告・解析ツール・アカウントは使いません。</li>
    </ul>
    <p><a href="/">対局へ戻る</a></p>
  </body>
</html>
